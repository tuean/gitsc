[package]
name = "gitsc-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "gitsc — 参考 IDEA 用法的 Git 桌面客户端"

[dependencies]
gitsc-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
flume.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `runtime_shaders` 让 GPUI 在运行时编译 Metal shader，只需要 Command Line
# Tools，不必装完整 Xcode。gpui-kit 已打开该 feature，并统一 re-export gpui。
gpui-kit = "0.7.3"

[[bin]]
name = "gitsc"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3"

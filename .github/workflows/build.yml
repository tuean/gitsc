name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (exe + setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p gitsc-core

      - name: cargo build
        run: cargo build --profile windows --target x86_64-pc-windows-msvc -p gitsc-app

      - name: Stage exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/windows/gitsc.exe dist/gitsc-windows-x86_64.exe

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"

      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          makensis /DAPP_VERSION=$version installer/gitsc.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: gitsc-windows-x64
          path: |
            dist/gitsc-windows-x86_64.exe
            dist/gitsc-*-windows-x64-setup.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gitsc-windows-x86_64.exe
            dist/gitsc-*-windows-x64-setup.exe

  macos:
    name: macOS (app bundle)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Bundle
        run: ./scripts/bundle-macos.sh

      - name: Zip app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/gitsc.app "dist/gitsc-macos-${{ runner.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gitsc-macos
          path: dist/gitsc-macos-*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gitsc-macos-*.zip

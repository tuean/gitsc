[workspace]
resolver = "2"
members = ["crates/gitsc-core", "crates/gitsc-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["zhongxiaotian"]

[workspace.dependencies]
gitsc-core = { path = "crates/gitsc-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flume = "0.11"
gpui-kit = "0.7.3"

# GPUI 是大块依赖代码，opt-level 1 让 debug 构建即开即用又不慢。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# release 优先体积与常驻内存。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Windows 交叉编译用：release 的优化 + debug_assertions。
# gpui 在 debug_assertions 打开时改用运行期 D3DCompile 编译 HLSL，
# 不依赖 Windows SDK 的 fxc.exe（macOS 上没有）。
[profile.windows]
inherits = "release"
debug-assertions = true

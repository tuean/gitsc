<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232529"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <radialGradient id="glowlight" cx="0.32" cy="0.25" r="0.62">
      <stop offset="0" stop-color="#202c3a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#202c3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="236"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowlight)"/>

    <!-- 线的外发光 -->
    <g filter="url(#soft)" opacity="0.45">
      <path d="M396 636 C486 634 664 560 664 366" fill="none" stroke="#9d7bd8" stroke-width="88" stroke-linecap="round"/>
      <path d="M396 300 L396 744" fill="none" stroke="#4c8dff" stroke-width="88" stroke-linecap="round"/>
    </g>

    <!-- 旁支先画，主干盖住交汇处 -->
    <path d="M396 636 C486 634 664 560 664 366" fill="none" stroke="#9d7bd8" stroke-width="88" stroke-linecap="round"/>
    <path d="M396 300 L396 744" fill="none" stroke="#4c8dff" stroke-width="88" stroke-linecap="round"/>

    <circle cx="396" cy="300" r="74" fill="#4c8dff"/>
    <circle cx="664" cy="300" r="74" fill="#9d7bd8"/>
    <circle cx="396" cy="744" r="86" fill="#62b543"/>

    <rect x="3" y="3" width="1018" height="1018" rx="234" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>
  </g>
</svg>
